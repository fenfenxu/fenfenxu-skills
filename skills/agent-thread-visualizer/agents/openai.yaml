interface:
  display_name: "Agent Thread Visualizer"
  short_description: "Agent 会话可视化 / session timeline for Cursor·Codex·Claude·Workbuddy·kimi-code — execution maps, skills/tools/sub-agents."
  default_prompt: "If the user is recalling a session by what they did (not id/title), follow find-thread/SKILL.md (/find-thread): all hosts, ranked cards, do not auto-visualize. Otherwise use find-thread-by-id (UUID) or find-thread-by-name (title/keywords/recent)—you choose which. Current host first when visualizing. Collect stages, skills, tool calls, sub-agents, then a layered execution map. Optional session-health tips at the end."
